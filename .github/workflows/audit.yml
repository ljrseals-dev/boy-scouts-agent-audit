name: Boy Scouts audit harness
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate schema coherence
        run: python scripts/check_schema_coherence.py
      - name: Run negative tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -v
